<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIM · Inventario de servidores</title><style>:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#e8edf5;background:#0d1421}*{box-sizing:border-box}body{margin:0}header{padding:25px max(20px,calc((100vw - 920px)/2));background:#142238;border-bottom:1px solid #2d405b}h1{margin:0;font-size:25px}header p{color:#b5c4d8;margin:6px 0 0}main{max-width:920px;margin:30px auto;padding:0 20px}.panel{background:#19283e;border:1px solid #34465f;border-radius:15px;padding:24px;margin-bottom:18px}input{width:100%;background:#0d1829;border:1px solid #455b76;border-radius:9px;padding:13px;color:white;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.item{background:#1b2b42;border:1px solid #354b67;border-radius:12px;padding:18px;text-decoration:none;color:inherit}.item:hover{border-color:#62b7ff}.muted{color:#aebed0}.back{color:#7bc5ff;text-decoration:none}dl{display:grid;grid-template-columns:minmax(115px,35%) 1fr;gap:0}dt,dd{margin:0;padding:12px 4px;border-bottom:1px solid #35475e;overflow-wrap:anywhere}dt{color:#aebed0}button{background:#2776c6;border:0;color:white;padding:11px 15px;border-radius:8px;cursor:pointer}small{color:#aebed0}#notfound{display:none}</style></head><body><header><h1>AIM · Inventario de servidores</h1><p>Consulta de equipos mediante código QR</p></header><main><section id="listing"><div class="panel"><h2>Buscar servidor</h2><input id="search" placeholder="Ej. SERVER 001" autocomplete="off"></div><div class="grid" id="cards"></div></section><section id="detail" hidden><p><a class="back" href="./">← Todos los servidores</a></p><div class="panel"><h2 id="name"></h2><p class="muted" id="subtitle"></p><dl id="specs"></dl><p><button id="copy">Copiar enlace de esta ficha</button></p></div></section><section id="notfound" class="panel"><h2>Servidor no encontrado</h2><p>Comprueba el código o vuelve al inventario.</p><a class="back" href="./">Ver inventario</a></section><p><small>Datos de ejemplo: sustituir por las especificaciones reales antes de publicar.</small></p></main><script>
// EDITA AQUÍ EL INVENTARIO. Cada ID debe ser único y no cambiar una vez impreso el QR.
const servidores=[
{id:'001',nombre:'SERVER 001',ubicacion:'Pendiente de asignar',procesador:'Intel Core i7 (ejemplo)',placa:'Pendiente de registrar',ram:'32 GB DDR4 (ejemplo)',grafica:'NVIDIA RTX (ejemplo)',almacenamiento:'Pendiente de registrar',sistema:'Windows 10 (ejemplo)',aim:'10.68 (ejemplo)',serie:'AIM-001 (ejemplo)',observaciones:'Ficha de demostración'},
{id:'002',nombre:'SERVER 002',ubicacion:'Pendiente de asignar',procesador:'Pendiente de registrar',placa:'Pendiente de registrar',ram:'Pendiente de registrar',grafica:'Pendiente de registrar',almacenamiento:'Pendiente de registrar',sistema:'Pendiente de registrar',aim:'Pendiente de registrar',serie:'Pendiente de registrar',observaciones:''},
{id:'003',nombre:'SERVER 003',ubicacion:'Pendiente de asignar',procesador:'Pendiente de registrar',placa:'Pendiente de registrar',ram:'Pendiente de registrar',grafica:'Pendiente de registrar',almacenamiento:'Pendiente de registrar',sistema:'Pendiente de registrar',aim:'Pendiente de registrar',serie:'Pendiente de registrar',observaciones:''}
];
const fields=[['ubicacion','Ubicación'],['procesador','Procesador'],['placa','Placa base'],['ram','Memoria RAM'],['grafica','Tarjeta gráfica'],['almacenamiento','Almacenamiento'],['sistema','Sistema operativo'],['aim','Versión AIM'],['serie','Número de serie'],['observaciones','Observaciones']];
const qs=new URLSearchParams(location.search),id=qs.get('id'),server=servidores.find(s=>s.id===id);const el=(tag,text)=>{const x=document.createElement(tag);x.textContent=text??'';return x};if(id){document.getElementById('listing').hidden=true;if(!server){document.getElementById('notfound').style.display='block'}else{document.getElementById('detail').hidden=false;document.getElementById('name').textContent=server.nombre;document.getElementById('subtitle').textContent='Ficha técnica · '+server.id;const dl=document.getElementById('specs');fields.forEach(([key,label])=>{dl.append(el('dt',label),el('dd',server[key]||'—'))});document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>alert('Enlace copiado')).catch(()=>prompt('Copia este enlace:',location.href))}}else{const cards=document.getElementById('cards');function render(term=''){cards.replaceChildren();servidores.filter(s=>(s.nombre+' '+s.ubicacion+' '+s.serie).toLowerCase().includes(term.toLowerCase())).forEach(s=>{const a=el('a');a.className='item';a.href='?id='+encodeURIComponent(s.id);a.append(el('h3',s.nombre),el('p',s.ubicacion));cards.append(a)});if(!cards.children.length)cards.append(el('p','No se encontraron servidores.'))}render();document.getElementById('search').addEventListener('input',e=>render(e.target.value))}
</script></body></html>
