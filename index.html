
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIM | Inventario de servidores </title>
  <style>
    :root {
      --bg: #101722;
      --panel: #1b2635;
      --border: #344357;
      --text: #f1f5f9;
      --muted: #a9b8ca;
      --blue: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      background: #172231;
      padding: 25px 18px;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px;
    }

    h1 { margin: 0 0 8px; }
    h2 { margin-top: 0; }

    .muted { color: var(--muted); }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #253449;
      color: white;
      font-size: 16px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, minmax(230px, 1fr)
      );
      gap: 15px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card h3 { margin-top: 0; }

    .btn {
      display: inline-block;
      padding: 11px 16px;
      background: var(--blue);
      color: #07131d;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn:hover { background: #7dd3fc; }

    .details {
      max-width: 750px;
      margin: 25px auto;
    }

    .field {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .field strong {
      display: block;
      color: var(--blue);
      margin-bottom: 5px;
    }

    .field span {
      overflow-wrap: anywhere;
    }

    .back { margin-bottom: 20px; }

    .count { margin-bottom: 20px; }

    footer {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

/* Identidad visual AIM */
body {
  min-height: 100vh;
  color: #23243b;
  background: radial-gradient(ellipse at 8% 35%, #ffd1ec 0%, transparent 48%),
              radial-gradient(ellipse at 84% 12%, #ff00cf 0%, transparent 42%),
              radial-gradient(ellipse at 48% 74%, #ff238b 0%, transparent 55%),
              linear-gradient(125deg, #ffb8e6 0%, #fa1497 45%, #f222ed 100%);
  background-attachment: fixed;
}
header { background: #fff; border-bottom: 1px solid #f2e5ee; padding: 18px 0; }
header .container { display:flex; align-items:center; justify-content:space-between; gap:20px; }
header h1 { color:#25233b; }
header .muted { color:#66627a; margin-bottom:0; }
.aim-logo { width: 118px; max-width: 28vw; height:auto; object-fit:contain; flex-shrink:0; }
.card { background:rgba(255,255,255,.94); border:1px solid rgba(255,255,255,.85); box-shadow:0 10px 30px rgba(128,0,86,.14); }
.field { border-bottom:1px solid #f0d8e8; }
.field strong { color:#df0784; }
.muted { color:#54465e; }
.btn { background:#f50991; color:#fff; }
.btn:hover { background:#cf067d; }
input { background:#fff; color:#262036; border:1px solid #f5c1df; }
footer { color:#fff; text-shadow:0 1px 4px rgba(95,0,65,.5); }
@media (max-width:550px) { header h1 {font-size:1.35rem;} header .container {padding:12px 16px;} .aim-logo {width:92px;} }

  </style>
</head>

<footer>
  AIM - Control servers of Eric Cabet

<script>
/*
==========================================
 INVENTARIO AIM - 53 SERVIDORES
==========================================

Para modificar un servidor, busca su número
en el objeto DATOS_SERVIDORES.

Los servidores sin datos específicos muestran
"Pendiente de registrar".

Los enlaces QR tienen este formato:

?id=001
?id=002
?id=003

Y así sucesivamente hasta el 053.

==========================================
*/

// Campos generales de cada servidor

const CAMPOS = {
  procesador: "Procesador",
  placa: "Placa base",
  ram: "Memoria RAM",
  grafica: "Tarjeta gráfica",
  almacenamiento: "Almacenamiento",
  windows: "Sistema operativo",
  aim: "Versión AIM",
  serie: "Número de serie",
  ubicacion: "Ubicación",
  observaciones: "Observaciones"
};

// ========================================
// EDITAR INFORMACIÓN DE LOS SERVIDORES
// ========================================

const DATOS_SERVIDORES = {

  "001": {
    procesador: "Intel Core i7",
    placa: "Pendiente de registrar",
    ram: "32 GB DDR4",
    grafica: "NVIDIA RTX",
    almacenamiento: "Pendiente de registrar",
    windows: "Windows 10",
    aim: "10.68",
    serie: "AIM-001",
    ubicacion: "Pendiente de registrar",
    observaciones: ""
  },

  "002": {
    procesador: "Pendiente de registrar",
    placa: "Pendiente de registrar",
    ram: "Pendiente de registrar",
    grafica: "Pendiente de registrar",
    almacenamiento: "Pendiente de registrar",
    windows: "Windows 10",
    aim: "Pendiente de registrar",
    serie: "AIM-002",
    ubicacion: "Pendiente de registrar",
    observaciones: ""
  },

  "003": {
    procesador: "Pendiente de registrar",
    placa: "Pendiente de registrar",
    ram: "Pendiente de registrar",
    grafica: "Pendiente de registrar",
    almacenamiento: "Pendiente de registrar",
    windows: "Windows 10",
    aim: "Pendiente de registrar",
    serie: "AIM-003",
    ubicacion: "Pendiente de registrar",
    observaciones: ""
  },

};
// ========================================
// CREAR AUTOMÁTICAMENTE 53 SERVIDORES
// ========================================

const servidores = [];

for (let numero = 1; numero <= 53; numero++) {

  const id = String(numero).padStart(3, "0");

const datos = {
  procesador: "Pendiente de registrar",
  placa: "Pendiente de registrar",
  ram: "Pendiente de registrar",
  grafica: "Pendiente de registrar",
  almacenamiento: "Pendiente de registrar",
  windows: "Pendiente de registrar",
  aim: "Pendiente de registrar",
  serie: "Pendiente de registrar",
  ubicacion: "Pendiente de registrar",
  observaciones: "",
  ...(DATOS_SERVIDORES[id] || {})
};

servidores.push({
  id: id,
  nombre: "SERVER " + id,
  ...datos,
  ...(DATOS_SERVIDORES[id] || {})
});

}

// ========================================
// FUNCIONES DE LA PÁGINA
// ========================================

const app = document.getElementById("app");

function crearElemento(etiqueta, clase, texto) {
  const elemento = document.createElement(etiqueta);

  if (clase) {
    elemento.className = clase;
  }

  if (texto !== undefined) {
    elemento.textContent = texto;
  }

  return elemento;
}

function mostrarInventario() {

  app.replaceChildren();

  const titulo = crearElemento(
    "h2", "", "Inventario de servidores AIM"
  );

  const contador = crearElemento(
    "p", "muted count",
    "Total: " + servidores.length + " servidores"
  );

  const buscador = crearElemento("input");
  buscador.type = "search";
  buscador.placeholder =
    "Buscar servidor por número, ubicación o serie...";

  const grid = crearElemento("div", "grid");

  app.append(titulo, contador, buscador, grid);

  function pintar(filtro = "") {

    grid.replaceChildren();

    const resultados = servidores.filter(s => {
      const texto = [
        s.nombre,
        s.ubicacion,
        s.serie
      ].join(" ").toLowerCase();

      return texto.includes(filtro.toLowerCase());
    });

    contador.textContent =
      "Mostrando " + resultados.length +
      " de " + servidores.length + " servidores";

    if (resultados.length === 0) {
      grid.appendChild(
        crearElemento("p", "muted",
          "No se encontraron servidores.")
      );
      return;
    }

    resultados.forEach(servidor => {

      const card = crearElemento("div", "card");

      const nombre = crearElemento(
        "h3", "", servidor.nombre
      );

      const ubicacion = crearElemento(
        "p", "muted",
        "Ubicación: " + servidor.ubicacion
      );

      const enlace = crearElemento(
        "a", "btn", "Ver ficha técnica"
      );

      enlace.href =
        "?id=" + encodeURIComponent(servidor.id);

      card.append(nombre, ubicacion, enlace);
      grid.appendChild(card);

    });
  }

  buscador.addEventListener("input", () => {
    pintar(buscador.value);
  });

  pintar();
}

function mostrarServidor(id) {

  app.replaceChildren();

  const servidorBase = servidores.find(s => s.id === id);

const servidor = servidorBase
  ? {
      ...servidorBase,
      ...(DATOS_SERVIDORES[id] || {})
    }
  : null;

  if (!servidor) {

    app.appendChild(
      crearElemento("h2", "",
        "Servidor no encontrado")
    );

    const volver = crearElemento(
      "a", "btn", "Volver al inventario"
    );

    volver.href = window.location.pathname;

    app.appendChild(volver);
    return;
  }

  const contenedor = crearElemento("div", "details");

  const volver = crearElemento(
    "a", "btn back", "← Volver al inventario"
  );

  volver.href = window.location.pathname;

  const tarjeta = crearElemento("div", "card");

  const titulo = crearElemento(
    "h2", "", "AIM " + servidor.nombre
  );

  const subtitulo = crearElemento(
    "p", "muted", "Ficha técnica del equipo"
  );

  tarjeta.append(titulo, subtitulo);

  Object.entries(CAMPOS).forEach(([clave, etiqueta]) => {

    const campo = crearElemento("div", "field");

    const nombre = crearElemento(
      "strong", "", etiqueta
    );

    const valor = crearElemento(
      "span", "",
      servidor[clave] || "Pendiente de registrar"
    );

    campo.append(nombre, valor);
    tarjeta.appendChild(campo);

  });

  contenedor.append(volver, tarjeta);
  app.appendChild(contenedor);
}

// ========================================
// DETECTAR SI VIENE DESDE UN CÓDIGO QR
// ========================================

const parametros = new URLSearchParams(
  window.location.search
);

const servidorSolicitado = parametros.get("id");

if (servidorSolicitado) {
  mostrarServidor(servidorSolicitado);
} else {
  mostrarInventario();
}

</script>
