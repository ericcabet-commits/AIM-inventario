
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIM | Inventario de servidores </title>
  <style>
    :root {
      --bg: #101722;
      --panel: #1b2635;
      --border: #344357;
      --text: #f1f5f9;
      --muted: #a9b8ca;
      --blue: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      background: #172231;
      padding: 25px 18px;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px;
    }

    h1 { margin: 0 0 8px; }
    h2 { margin-top: 0; }

    .muted { color: var(--muted); }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #253449;
      color: white;
      font-size: 16px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, minmax(230px, 1fr)
      );
      gap: 15px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card h3 { margin-top: 0; }

    .btn {
      display: inline-block;
      padding: 11px 16px;
      background: var(--blue);
      color: #07131d;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn:hover { background: #7dd3fc; }

    .details {
      max-width: 750px;
      margin: 25px auto;
    }

    .field {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .field strong {
      display: block;
      color: var(--blue);
      margin-bottom: 5px;
    }

    .field span {
      overflow-wrap: anywhere;
    }

    .back { margin-bottom: 20px; }

    .count { margin-bottom: 20px; }

    footer {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

/* Identidad visual AIM */
body {
  min-height: 100vh;
  color: #23243b;
  background: radial-gradient(ellipse at 8% 35%, #ffd1ec 0%, transparent 48%),
              radial-gradient(ellipse at 84% 12%, #ff00cf 0%, transparent 42%),
              radial-gradient(ellipse at 48% 74%, #ff238b 0%, transparent 55%),
              linear-gradient(125deg, #ffb8e6 0%, #fa1497 45%, #f222ed 100%);
  background-attachment: fixed;
}
header { background: #fff; border-bottom: 1px solid #f2e5ee; padding: 18px 0; }
header .container { display:flex; align-items:center; justify-content:space-between; gap:20px; }
header h1 { color:#25233b; }
header .muted { color:#66627a; margin-bottom:0; }
.aim-logo { width: 118px; max-width: 28vw; height:auto; object-fit:contain; flex-shrink:0; }
.card { background:rgba(255,255,255,.94); border:1px solid rgba(255,255,255,.85); box-shadow:0 10px 30px rgba(128,0,86,.14); }
.field { border-bottom:1px solid #f0d8e8; }
.field strong { color:#df0784; }
.muted { color:#54465e; }
.btn { background:#f50991; color:#fff; }
.btn:hover { background:#cf067d; }
input { background:#fff; color:#262036; border:1px solid #f5c1df; }
footer { color:#fff; text-shadow:0 1px 4px rgba(95,0,65,.5); }
@media (max-width:550px) { header h1 {font-size:1.35rem;} header .container {padding:12px 16px;} .aim-logo {width:92px;} }

  
.toolbar {display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 20px}
.toolbar .btn {font-size:14px}
.status {display:inline-block;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;background:#e9eaf0;color:#555}
.status-operativo {background:#d8f5e4;color:#14673b}
.status-mantenimiento {background:#fff0c5;color:#835b00}
.status-averiado {background:#ffe0e4;color:#a01732}
.status-pendiente {background:#fff0b3;color:#795600}
.status-line {margin:12px 0}
.qr-box {background:#fff;border:1px solid #f1d4e5;border-radius:12px;padding:20px;margin-top:22px;text-align:center}
.qr-code {display:flex;justify-content:center;margin:16px auto}
.qr-code img,.qr-code canvas {max-width:100%;height:auto}
.qr-link {overflow-wrap:anywhere;font-size:12px;color:#605469}
.summary {display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.summary span {background:#fff;padding:9px 13px;border-radius:8px;font-size:13px}
@media print {
 body {background:white!important;color:black!important}
 header,footer,.back,.toolbar,.field,.summary,.no-print {display:none!important}
 .container,.details {padding:0!important;margin:0!important;max-width:none!important}
 .card {border:0!important;box-shadow:none!important}
 .qr-box {border:0!important;margin:0!important}
 .qr-code {margin:12px auto!important}
 .print-title {font-size:22px!important}
}
</style>
</head>

const ESTADOS = ["En servicio", "Para reparar", "Pendiente de revisar"];
const servidores = Array.from({length:100}, (_,i) => {
  const id=String(i+1).padStart(3,"0");
  const vacio=Object.fromEntries(Object.keys(CAMPOS).map(k=>[k,"Pendiente de registrar"]));
  return {id,nombre:"SERVER "+id,...vacio,estado:"Pendiente de revisar",...(DATOS_SERVIDORES[id]||{})};
});
const app=document.getElementById("app");
const crear=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const linkServidor=id=>window.location.origin+window.location.pathname+"?id="+encodeURIComponent(id);
const cssEstado=estado=>({"En servicio":"status-operativo","Para reparar":"status-averiado"}[estado]||"status-pendiente");
function insignia(estado){return crear("span","status "+cssEstado(estado),estado);}
function boton(texto,accion){const b=crear("button","btn",texto);b.type="button";b.addEventListener("click",accion);return b;}
function csvSeguro(valor){let s=String(valor??"");if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
function exportarCSV(){
 const columnas=["id","estado",...Object.keys(CAMPOS)];
 const cabecera=["Servidor","Estado",...Object.values(CAMPOS)];
 const filas=[cabecera,...servidores.map(s=>columnas.map(c=>c==="id"?s.nombre:s[c]))];
 const csv="\uFEFF"+filas.map(f=>f.map(csvSeguro).join(";")).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
 const a=crear("a");a.href=url;a.download="AIM_inventario_100_servidores.csv";
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function mostrarInventario(){
 app.replaceChildren();
 app.append(crear("h2","","Inventario de servidores AIM"));
 const resumen=crear("div","summary");
 resumen.append(crear("span","","Total: "+servidores.length));
 for(const estado of ESTADOS){resumen.append(crear("span","",estado+": "+servidores.filter(s=>s.estado===estado).length));}
 app.append(resumen);
 const barra=crear("div","toolbar");barra.append(boton("Exportar Excel / CSV",exportarCSV));app.append(barra);
 const buscador=crear("input");buscador.type="search";buscador.placeholder="Buscar por servidor, ubicación, número de serie...";
 const filtroEstado=crear("select");filtroEstado.setAttribute("aria-label","Filtrar por estado");
 filtroEstado.style.cssText="padding:12px;border-radius:8px;border:1px solid #f5c1df;background:#fff;margin-bottom:18px;max-width:260px";
 for(const est of ["Todos los estados",...ESTADOS]){const op=crear("option","",est);op.value=est;filtroEstado.append(op);}
 const contador=crear("p","muted");const grid=crear("div","grid");app.append(buscador,filtroEstado,contador,grid);
 function pintar(){grid.replaceChildren();const q=buscador.value.toLowerCase().trim();
  const resultados=servidores.filter(s=>(filtroEstado.value==="Todos los estados"||s.estado===filtroEstado.value)&&[s.nombre,s.ubicacion,s.serie,s.procesador,s.aim].join(" ").toLowerCase().includes(q));
  contador.textContent="Mostrando "+resultados.length+" de "+servidores.length+" servidores";
  for(const s of resultados){const card=crear("div","card");card.append(crear("h3","",s.nombre),insignia(s.estado),crear("p","muted","Ubicación: "+s.ubicacion));
   const a=crear("a","btn","Ver ficha y QR");a.href="?id="+s.id;card.append(a);grid.append(card);}
  if(!resultados.length)grid.append(crear("p","muted","No se encontraron servidores."));
 }
 buscador.addEventListener("input",pintar);filtroEstado.addEventListener("change",pintar);pintar();
}
function mostrarServidor(id){
 app.replaceChildren();const s=servidores.find(x=>x.id===id);
 if(!s){app.append(crear("h2","","Servidor no encontrado"));return;}
 const contenedor=crear("div","details");const volver=crear("a","btn back","← Volver al inventario");volver.href=window.location.pathname;
 const tarjeta=crear("div","card");tarjeta.append(crear("h2","", "AIM "+s.nombre),crear("p","muted","Ficha técnica del equipo"));
 const linea=crear("div","status-line");linea.append(crear("strong","","Estado: "),insignia(s.estado));tarjeta.append(linea);
 for(const [clave,etiqueta] of Object.entries(CAMPOS)){
  const campo=crear("div","field");campo.append(crear("strong","",etiqueta),crear("span","",s[clave]||"Pendiente de registrar"));tarjeta.append(campo);
 }
 const qr=crear("section","qr-box");qr.append(crear("h2","print-title","AIM "+s.nombre));
 const zona=crear("div","qr-code");zona.id="qr-"+s.id;qr.append(zona);
 const url=linkServidor(s.id);qr.append(crear("p","qr-link",url));
 const acciones=crear("div","toolbar no-print");acciones.style.justifyContent="center";
 acciones.append(boton("Imprimir etiqueta QR",()=>window.print()));qr.append(acciones);
 tarjeta.append(qr);contenedor.append(volver,tarjeta);app.append(contenedor);
 if(typeof QRCode!=="undefined"){
  new QRCode(zona,{text:url,width:220,height:220,colorDark:"#191327",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
 }else{
  zona.append(crear("p","muted","No se pudo cargar el generador QR. Comprueba tu conexión a Internet."));
 }
}
const params=new URLSearchParams(window.location.search);
const id=params.get("id");if(id)mostrarServidor(id);else mostrarInventario();
